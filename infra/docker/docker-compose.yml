services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       opslens
      POSTGRES_USER:     opslens
      POSTGRES_PASSWORD: opslens_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opslens"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.0
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: ../..
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: ../../.env
    environment:
      DATABASE_URL:      postgresql+asyncpg://opslens:opslens_dev@postgres/opslens
      QDRANT_URL:        http://qdrant:6333
      REDIS_URL:         redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      qdrant:   { condition: service_started }
    volumes:
      - ../../apps:/app/apps
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload --log-level info

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DATABASE_URL:          postgresql+asyncpg://opslens:opslens_dev@postgres/opslens
      QDRANT_URL:            http://qdrant:6333
      CELERY_BROKER_URL:     redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    volumes:
      - ../../apps:/app/apps
    command: celery -A apps.worker.celery_app worker --loglevel=info --concurrency=2 -Q ingestion,insights,alerts

  beat:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: ../../.env
    environment:
      CELERY_BROKER_URL:     redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis
    volumes:
      - ../../apps:/app/apps
    command: celery -A apps.worker.celery_app beat --loglevel=info

  web:
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ../../apps/web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    depends_on:
      - api

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - redis

volumes:
  postgres_data:
  qdrant_data:
  web_node_modules:
