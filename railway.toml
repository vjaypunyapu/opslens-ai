# railway.toml — OpsLens AI (all services)
# All three services (api, worker, beat) share this repo and this file.
# The start command uses $RAILWAY_SERVICE_NAME to dispatch the right process.
#
# Railway service names must match exactly (case-sensitive):
#   Service named "api"    → runs uvicorn
#   Service named "worker" → runs celery worker
#   Service named "beat"   → runs celery beat

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.api"

[deploy]
startCommand = """sh -c '
  if [ "$RAILWAY_SERVICE_NAME" = "worker" ]; then
    exec celery -A apps.worker.celery_app worker --loglevel=info --concurrency=2 -Q celery,ingestion,insights,alerts,logs,rrt
  elif [ "$RAILWAY_SERVICE_NAME" = "beat" ]; then
    exec celery -A apps.worker.celery_app beat --loglevel=info
  else
    echo "Running Alembic migrations..." && alembic upgrade head && exec uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT --no-access-log
  fi
'"""
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
# Note: healthcheckPath is NOT set here so it can be configured per-service
# in the Railway dashboard. Set it to /health on the API service only —
# the worker (Celery) does not serve HTTP so must have no health check.
