# railway.toml — OpsLens AI API service
# Deploy this service first. Worker and Beat services share the same repo
# but use different start commands (set in Railway dashboard per service).
#
# Service start commands:
#   API:    uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
#   Worker: celery -A apps.worker.celery_app worker --loglevel=info --concurrency=2 -Q celery,ingestion,insights,alerts,logs,rrt
#   Beat:   celery -A apps.worker.celery_app beat --loglevel=info

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.api"

[deploy]
startCommand = "sh -c 'uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT --no-access-log'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
