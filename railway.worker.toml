# railway.worker.toml — OpsLens AI Celery Worker service
# In Railway dashboard: set "Config file path" to railway.worker.toml for the worker service

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.worker"

[deploy]
startCommand = "celery -A apps.worker.celery_app worker --loglevel=warning --concurrency=2 -Q ingestion,insights,alerts"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
